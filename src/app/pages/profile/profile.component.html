<div class="bg-inherit text-inherit  md:p-4  mt-20">
  <div class="max-w-6xl bg-inherit mx-auto">
    <!-- Profile Header -->

    <!-- Profile Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Player Card -->
      <div class="bg-inherit text-inherit rounded-xl shadow-md overflow-hidden">
        <div class="p-6">
          <div class="flex flex-col items-center">
            <div class="relative mb-4">
              <img
                [src]="user?.profile"
                alt="Player Image"
                class="w-40 h-40 rounded-full object-cover border-4 border-white dark:border-gray-700 shadow-lg"
              />

              <button
                (click)="fileInput.click()"
                class="absolute bottom-2 right-2 bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700 transition"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
                  />
                </svg>
              </button>
              <input
                #fileInput
                type="file"
                class="hidden"
                accept="image/*"
                (change)="onFileSelected($event)"
              />
            </div>

            <h2 class="text-xl font-bold">{{ user?.name }}</h2>
            <p class="text-blue-600 dark:text-blue-400">
              {{ user?.specialization }}
            </p>
            <p class="">{{ user?.email }}</p>
          </div>
        </div>

        <div class="border-t border-gray-200 dark:border-gray-700 px-6 py-4">
          <button
            (click)="openEditModal()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md transition"
          >
            Edit Profile
          </button>
        </div>
      </div>

      <!-- Player Stats -->
      <div class="lg:col-span-2">
        <div class="rounded-xl shadow-md overflow-hidden">
          <!-- <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">Player Statistics</h3>
          </div> -->

          <div class="py-6 px-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Personal Info -->
              <div>
                <h4 class="text-md font-medium mb-4">Personal Information</h4>
                <div class="space-y-3">
                  <div>
                    <p class="text-sm">Full Name</p>
                    <p class="">{{ user?.name }}</p>
                  </div>
                  <div class="flex justify-between">
                    <div>
                      <p class="text-sm">Email</p>
                      <p class="">{{ user?.email }}</p>
                    </div>
                    <div>
                      <p class="text-sm">Mobile</p>
                      <p class="">{{ user?.mobile ||"NOT AVAILABLE"  }}</p>
                    </div>
                  </div>
                  <div class="flex justify-between">
                    <div>
                      <p class="text-sm">Gender</p>
                      <p class="">{{ user?.gender ||"NOT AVAILABLE" }}</p>
                    </div>
                    <div>
                      <p class="text-sm">DOB</p>
                      <p class="">{{ user?.dob ||"NOT AVAILABLE"  |date}}</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Cricket Stats -->
              <!-- <div>
                <h4 class="text-md font-medium text-gray-700 dark:text-gray-300 mb-4">Career Statistics</h4>
                <div class="grid grid-cols-2 gap-4">
                  <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-blue-600 dark:text-blue-400">Matches</p>
                    <p class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.matches }}</p>
                  </div>
                  <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-blue-600 dark:text-blue-400">Runs</p>
                    <p class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.runs }}</p>
                  </div>
                  <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-blue-600 dark:text-blue-400">Average</p>
                    <p class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.average }}</p>
                  </div>
                  <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-blue-600 dark:text-blue-400">Centuries</p>
                    <p class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.centuries }}</p>
                  </div>
                  <div class="bg-blue-50 dark:bg-gray-700 p-3 rounded-lg">
                    <p class="text-sm text-blue-600 dark:text-blue-400">Wickets</p>
                    <p class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.wickets }}</p>
                  </div>
                </div>
              </div> -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div *ngIf="isEditing" class="absolute bg-white border border-gray-400 z-10 top-4 w-full md:left-4/12 md:w-4/12 md:px-5 rounded-2xl md:py-3">
      <div class="modal-header bg-blue-600 text-white flex justify-between ">
        <h4 class="modal-title">Edit Player Profile</h4>
        <button
          type="button"
          class="close text-white"
          aria-label="Close"
          (click)="openEditModal()"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <!-- Blur -->
      <div class="fixed inset-0 bg-inherit blur-md -z-10 bg-opacity-75 transition-opacity" aria-hidden="true" @modalFade></div>

      <div class=" bg-inherit w-full p-4">
        <form class="w-full bg-inherit" [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <div class="grid grid-cols-1  gap-4 ">
            <!-- Right Column -->
            <div >
              <div class="mb-4 w-full">
                <label class="block mb-1"
                  >Full Name</label
                >
                <input
                  type="text"
                  formControlName="name"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                />
              </div>

              <div class="mb-4">
                <label class="block  mb-1"
                  >Email</label
                >
                <input
                  type="email"
                  formControlName="email"
                  class="w-full px-3 py-2 border  rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                />
              </div>
              <div class="mb-4">
                <label class="block  mb-1"
                  >Dob</label
                >
                <input
                  type="date"
                  formControlName="dob"
                  class="w-full px-3 py-2 border  rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                />
              </div>
              <div class="flex justify-between w-full">
              <div class="mb-4">
                <label class="block  mb-1"
                  >Gender</label
                >
                <!-- <input
                  type=""
                  formControlName="gender"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
                /> -->
                 <select name="gender" formControlName="gender" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 ">
                  <option value="">Select Gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="others">Others</option>
                 </select>
              </div>

              <div class="mb-4">
                <label class="block  mb-1"
                  >Mobile</label
                >
                <input
                  type="tel"
                  formControlName="mobile"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                />
              </div>
            </div>

              <div class="mb-4">
                <label class="block  mb-1"
                  >Specilization</label
                >
                <input
                  type="text"
                  formControlName="specialization"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                />
              </div>
              <div class="flex gap-1">
                <div class="mb-4">
                  <label class="block mb-1"
                    >City</label
                  >
                  <input
                    type="text"
                    formControlName="city"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 "
                  />
                </div>

                <div class="mb-4">
                  <label class="block  mb-1"
                    >Country</label
                  >
                  <input
                    type="text"
                    formControlName="country"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
            </div>

            <!-- Full Width Fields -->
          </div>

          <div class="mt-6 flex  space-x-3">
            <button
              type="button"
              (click)="openEditModal()"
              class="px-4 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-white rounded-md hover:bg-gray-300 dark:hover:bg-gray-500 transition"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition"
              (click)="updateProfile()"
            >
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
