<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <div class="mb-8 text-center animate-fade-in">
      <h1 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Cricket Teams</h1>
      <p class="mt-3 max-w-2xl mx-auto text-lg text-gray-600">
        Browse through national and domestic cricket teams across the globe.
      </p>
    </div>

    <!-- Filter Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 animate-fade-in animate-delay-100">
      <!-- Filters -->
      <div class="flex space-x-2">
        <button (click)="teamType = 'all'"
                [class]="teamType === 'all' ?
                'px-4 py-2 rounded-md text-sm font-medium text-white bg-red-500' :
                'px-4 py-2 rounded-md text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50'">
          All Teams
        </button>
        <button (click)="teamType = 'international'"
                [class]="teamType === 'international' ?
                'px-4 py-2 rounded-md text-sm font-medium text-white bg-red-500' :
                'px-4 py-2 rounded-md text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50'">
          International
        </button>
        <button (click)="teamType = 'domestic'"
                [class]="teamType === 'domestic' ?
                'px-4 py-2 rounded-md text-sm font-medium text-white bg-red-500' :
                'px-4 py-2 rounded-md text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50'">
          Domestic
        </button>
      </div>
    </div>

    <!-- Teams Grid -->
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 animate-fade-in animate-delay-200">
      <div *ngFor="let team of filteredTeams"
           class="bg-white overflow-hidden shadow rounded-lg border border-gray-200 hover:shadow-lg transition-shadow duration-300">
        <div class="px-4 py-5 sm:p-6">
          <div class="flex items-center space-x-4">
            <img [src]="team.logo" alt="{{ team.name }} Logo" class="h-14 w-14 rounded-full object-contain">
            <div>
              <h3 class="text-lg font-semibold text-gray-900">{{ team.name }}</h3>
              <p class="text-sm text-gray-500">{{ team.country }}</p>
            </div>
          </div>

          <div class="mt-4 grid grid-cols-2 gap-4 text-sm text-gray-700">
            <div>
              <p class="text-gray-500">Matches Played</p>
              <p class="font-medium">{{ team.matches }}</p>
            </div>
            <div>
              <p class="text-gray-500">Wins</p>
              <p class="font-medium">{{ team.wins }}</p>
            </div>
            <div>
              <p class="text-gray-500">Losses</p>
              <p class="font-medium">{{ team.losses }}</p>
            </div>
            <div>
              <p class="text-gray-500">Captain</p>
              <p class="font-medium">{{ team.captain }}</p>
            </div>
          </div>

          <div class="mt-5">
            <button class="w-full flex justify-center items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
              View Team
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredTeams.length === 0" class="text-center py-12 animate-fade-in animate-delay-300">
      <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h3 class="mt-2 text-lg font-medium text-gray-900">No teams found</h3>
      <p class="mt-1 text-sm text-gray-500">Try changing the filters to see teams.</p>
    </div>
  </div>
</div>
