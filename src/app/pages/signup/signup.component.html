<!-- signup.component.html -->
<div class="min-h-screen w-screen flex items-center justify-center bg-inherit text-inherit px-4 py-12">
  <div class="w-full max-w-md bg-inherit border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg p-8">

    <!-- Logo & Header -->
    <div class="text-center mb-8 mt-2">

        <div class="w-24 h-24 bg-inherit rounded-full shadow-md flex items-center justify-center mx-auto ">
          <!-- <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-16 h-16">

            <circle cx="50" cy="50" r="45" fill="none" stroke="#f87171" stroke-width="2"/>
            <path d="M50 20 L50 80 M20 50 L80 50" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="10" fill="#f87171"/>
            <path d="M30 30 Q50 10 70 30 M30 70 Q50 90 70 70" stroke="#f87171" stroke-width="2" fill="none"/>
          </svg> -->
        <img class="" src="/assests/images/cricket.png" alt="" srcset="">
        </div>


      <h2 class="mt-4 text-2xl font-bold text-inherit">Create an Account</h2>
      <p class="mt-1 text-sm text-inherit">Join your cricket team today</p>
    </div>

    <!-- Signup Form -->
    <form class="space-y-5" (ngSubmit)="onSignup()" #signupForm="ngForm">
      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium text-inherit mb-1">Full Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <input type="text" name="fullName" [(ngModel)]="fullName" required
                 class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-inherit text-inherit placeholder-gray-400 dark:placeholder-gray-500 focus:ring-red-200 focus:border-red-300"
                 placeholder="John Doe">
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-inherit mb-1">Email</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
            </svg>
          </div>
          <input type="email" name="email" [(ngModel)]="email" required
                 class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-inherit text-inherit placeholder-gray-400 dark:placeholder-gray-500 focus:ring-red-200 focus:border-red-300"
                 placeholder="you@example.com">
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-inherit mb-1">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input type="password" name="password" [(ngModel)]="password" required
                 class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-inherit text-inherit placeholder-gray-400 dark:placeholder-gray-500 focus:ring-red-200 focus:border-red-300"
                 placeholder="••••••••">
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-inherit mb-1">Confirm Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required
                 class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-inherit text-inherit placeholder-gray-400 dark:placeholder-gray-500 focus:ring-red-200 focus:border-red-300"
                 placeholder="••••••••">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full py-3 px-4 rounded-md shadow text-sm font-medium text-white bg-red-500 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-200 focus:ring-offset-2 transition-colors duration-200">
        Sign up
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-6 text-sm text-center text-gray-600 dark:text-gray-400">
      Already have an account?
      <a routerLink="/signin"
         class="text-red-500 hover:text-red-600 font-medium transition-colors duration-200">Log in</a>
    </p>
  </div>
</div>
