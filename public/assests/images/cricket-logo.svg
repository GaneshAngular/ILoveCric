<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-16 h-16">
  <!-- Cricket Ball -->
  <circle cx="75" cy="30" r="10" fill="#a61e1e" stroke="#7f1d1d" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 75 30" to="360 75 30" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M75 20a10 10 0 0 1 0 20 10 10 0 0 1 0-20z" fill="none" stroke="#f5f5f5" stroke-width="1"/>

  <!-- Cricket Bat -->
  <path d="M30 10 L20 60 L25 65 L35 15 Z" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
  <path d="M25 20 L30 15 L50 35 L45 40 Z" fill="#92400e" stroke="#451a03" stroke-width="1"/>

  <!-- Cricket Stumps -->
  <rect x="50" y="20" width="3" height="40" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5"/>
  <rect x="60" y="20" width="3" height="40" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5"/>
  <rect x="70" y="20" width="3" height="40" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5"/>
  <rect x="48" y="20" width="27" height="3" rx="1" fill="#92400e" stroke="#451a03" stroke-width="0.5"/>

  <!-- Bails -->
  <rect x="50" y="17" width="25" height="2" rx="1" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="0.5"/>
</svg>
